<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nexus</title>
  
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="app-container">
    <nav class="sidebar">
      <div class="workspace-logo">N</div>
      <div class="nav-items">
        <div class="bubble active" id="nav-chat" title="Chat">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path></svg>
        </div>
        <div class="bubble" id="nav-video" title="Video Lounge">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="23 7 16 12 23 17 23 7"></polygon><rect x="1" y="5" width="15" height="14" rx="2" ry="2"></rect></svg>
        </div>
        <div class="bubble" id="nav-friends" title="Friends">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M23 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path></svg>
        </div>
        <div class="bubble" id="nav-settings" title="Settings">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
        </div>
      </div>
    </nav>

    <div class="main-content">
      
      <main class="view-panel active" id="view-chat">
        <header class="chat-header"><div class="channel-info"><h2>general-chatter</h2></div></header>
        <div class="message-list" id="chat-feed"></div>
        <div class="compose-area">
          <div id="image-preview-container" style="display: none;">
            <img id="preview-img" src="" alt="Preview"><button id="cancel-img-btn">✕</button>
          </div>
          <div class="compose-box" id="main-compose-box">
            <input type="file" id="file-upload" accept="image/*" style="display: none;">
            <button id="attach-btn" title="Upload Image or Take Photo">
              <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
            </button>
            <input type="text" id="msg-input" placeholder="Type a message..." autocomplete="off">
            <button id="send-btn">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 2L11 13M22 2l-7 20-4-9-9-4 20-7z"/></svg>
            </button>
          </div>
        </div>
      </main>

      <main class="view-panel" id="view-video">
        <div class="video-workspace">
          <div class="remote-view">
            <div class="remote-placeholder" id="remote-placeholder">
              <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1"><polygon points="23 7 16 12 23 17 23 7"></polygon><rect x="1" y="5" width="15" height="14" rx="2" ry="2"></rect></svg>
              <p>Waiting for connection...</p>
            </div>
            <video id="remote-video" autoplay playsinline></video>
          </div>

          <div class="local-view" id="local-view-box">
            <video id="local-video" autoplay playsinline muted></video>
            
            <div class="call-overlay" id="pre-call-ui">
              <button id="start-cam-btn" class="glass-btn primary">Start Camera</button>
              <div id="dialer-ui" style="display: none; width: 100%;">
                <p id="call-id-display" class="room-code-text">Host or Join</p>
                <div class="action-row" id="action-row-buttons">
                  <button id="create-call-btn" class="glass-btn">Host Room</button>
                  <div class="join-group">
                    <input type="text" id="call-id-input" placeholder="Code" maxlength="4">
                    <button id="answer-call-btn" class="glass-btn">Join</button>
                  </div>
                </div>
                <button id="cancel-dial-btn" class="glass-btn danger-text" style="display: none; margin-top: 15px;">Cancel</button>
              </div>
            </div>
          </div>

          <div class="in-call-bar" id="in-call-ui">
            <button id="toggle-mic-btn" class="control-bubble secondary-bubble" title="Toggle Mic">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"></path><path d="M19 10v2a7 7 0 0 1-14 0v-2"></path><line x1="12" y1="19" x2="12" y2="23"></line><line x1="8" y1="23" x2="16" y2="23"></line></svg>
            </button>
            <button id="toggle-cam-btn" class="control-bubble secondary-bubble" title="Toggle Camera">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M23 7l-7 5 7 5V7z"></path><rect x="1" y="5" width="15" height="14" rx="2" ry="2"></rect></svg>
            </button>
            <button id="share-screen-btn" class="control-bubble secondary-bubble" title="Share Screen">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="3" width="20" height="14" rx="2" ry="2"></rect><line x1="8" y1="21" x2="16" y2="21"></line><line x1="12" y1="17" x2="12" y2="21"></line></svg>
            </button>
            <button id="hangup-btn" class="control-bubble danger-bubble" title="End Call">
              <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M10.68 13.31a16 16 0 0 0 3.41 2.6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7 2 2 0 0 1 1.72 2v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.42 19.42 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91"></path><line x1="23" y1="1" x2="1" y2="23"></line></svg>
            </button>
          </div>
        </div>
      </main>

      <main class="view-panel" id="view-friends">
        <header class="chat-header"><div class="channel-info"><h2>Friends</h2></div></header>
        <div class="settings-page" style="align-items: center; justify-content: center; height: 100%; color: #52525b;">
          <p>Friend system network updates coming soon.</p>
        </div>
      </main>

      <main class="view-panel" id="view-settings">
        <header class="chat-header"><div class="channel-info"><h2>User Settings</h2></div></header>
        <div class="settings-page">
          <div class="setting-group"><label>Display Name</label><input type="text" id="set-name" placeholder="Enter your username"></div>
          <div class="setting-group"><label>Profile Color</label><input type="color" id="set-color" value="#38bdf8"></div>
          <button id="save-btn" class="primary-btn">Save Identity</button>
          <span id="save-status" class="status-text"></span>
        </div>
      </main>

    </div>
  </div>

  <div id="user-context-menu" class="context-menu" style="display: none;">
    <div class="menu-header"><span id="context-user-name">Username</span></div>
    <div class="menu-actions">
      <button id="ctx-call"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"></path></svg> Call</button>
      <button id="ctx-dm"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path></svg> Message</button>
      <button id="ctx-friend"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="8.5" cy="7" r="4"></circle><line x1="20" y1="8" x2="20" y2="14"></line><line x1="23" y1="11" x2="17" y2="11"></line></svg> Add Friend</button>
      <button id="ctx-block" class="danger-text"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"></circle><line x1="4.93" y1="4.93" x2="19.07" y2="19.07"></line></svg> Block</button>
    </div>
  </div>

  <script type="module" src="script.js"></script>

</body>
</html>
